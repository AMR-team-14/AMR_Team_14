name: JSM Claude analysis
# Analyzes Case 3-5 results with Claude Code on the owner's subscription (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`).
# Runs (1) right after "JSM overnight experiments" finishes (called from jsm-five-case.yml),
#      (2) when collected results (GitHub + Kaggle) are pushed to jsm, or when this workflow/prompt changes.
# Before analysis, every jsm-five-case run whose artifacts are not yet in the repo is downloaded into
# experiments/common/five-case/raw/github/<run_id>/ (artifacts expire after 30 days; this keeps them).
# Claude compares all results with reports/known-insights.md, reports only what is new per case, and updates
# that file. The archive, report and insights file are committed to jsm by a plain git step (Claude never pushes).
on:
  workflow_call:
  push:
    branches: [jsm]
    paths:
      - 'experiments/case3/JSM-*.csv'
      - 'experiments/case4/JSM-*.csv'
      - 'experiments/case5/JSM-*.csv'
      - 'experiments/common/five-case/raw/**'
      - 'experiments/JSM/five-case/raw/**'
      - 'experiments/common/five-case/claude-analysis-prompt.md'
      - '.github/workflows/jsm-analyze.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: jsm-analyze
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            experiments/case3
            experiments/case4
            experiments/case5
            experiments/common/five-case
            simulator
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Archive experiment artifacts not yet in the repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCH=experiments/common/five-case/raw/github
          mkdir -p "$ARCH"
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            -q '.artifacts[] | select(.expired|not) | select(.workflow_run.head_branch=="jsm")
                | select(.name=="batch-summary" or (.name|startswith("jsm-five-case-"))) | .workflow_run.id' \
            | sort -u > runs.txt
          while read -r RUN; do
            [ -d "$ARCH/$RUN" ] && continue
            gh run download "$RUN" -R "${{ github.repository }}" -D "$ARCH/$RUN" -p 'jsm-five-case-*' -p batch-summary \
              && echo "$RUN" >> new-runs.txt || rm -rf "$ARCH/$RUN"
          done < runs.txt
          echo "새로 보관한 실행: $(cat new-runs.txt 2>/dev/null | tr '\n' ' ')"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Analyze
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat experiments/common/five-case/claude-analysis-prompt.md)" \
            --allowedTools "Read,Glob,Grep,Write,Bash(node:*),Bash(ls:*),Bash(head:*),Bash(wc:*)" \
            --max-turns 40 > claude-log.txt
          test -s report.md
      - name: Publish report
        if: always()
        run: |
          if [ -s report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"
          else echo "report.md가 없습니다. claude-report 아티팩트의 claude-log.txt를 확인하세요." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Commit report to jsm
        if: always() && github.ref == 'refs/heads/jsm'
        run: |
          [ -s report.md ] || { echo "no report"; exit 0; }
          DIR=experiments/common/five-case/reports
          NAME="$(TZ=Asia/Seoul date +%m%d-%H%M)-run${{ github.run_id }}"
          mkdir -p "$DIR"; cp report.md "$DIR/$NAME.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch --depth=1 origin jsm && git reset -q --mixed FETCH_HEAD
            for f in "$DIR/$NAME.md" "$DIR/known-insights.md" experiments/common/five-case/raw/github; do
              if [ -e "$f" ]; then git add -f "$f"; fi
            done
            git commit -q -m "Claude analysis $NAME [skip ci]" && git push origin HEAD:jsm && exit 0
            sleep $((i*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            report.md
            claude-log.txt
          if-no-files-found: warn
          retention-days: 30
