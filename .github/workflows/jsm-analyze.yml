name: JSM Claude analysis
# Analyzes Case 3-5 results with Claude Code on the owner's subscription (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`).
# Runs (1) right after "JSM overnight experiments" finishes (called from jsm-five-case.yml),
#      (2) when collected results (GitHub + Kaggle) are pushed to jsm, or when this workflow/prompt changes.
# Before analysis, every jsm-five-case run whose artifacts are not yet in the repo is downloaded into
# experiments/common/five-case/raw/github/<run_id>/ (artifacts expire after 30 days; this keeps them).
# digest.cjs then computes every number deterministically (coverage, public/held-out stats, CRN paired tests with
# Holm, screening subset, one-factor effects, OCBA) into digest.json and writes the basic report (basic.md).
# Claude writes only the deep analysis (deep.md) from digest.json and reports/known-insights.md. A plain git step commits archive, digest, state,
# report and insights file to jsm (Claude never computes, commits or pushes).
on:
  workflow_call:
  push:
    branches: [jsm]
    paths:
      - 'experiments/case3/JSM-*.csv'
      - 'experiments/case4/JSM-*.csv'
      - 'experiments/case5/JSM-*.csv'
      - 'experiments/common/five-case/raw/**'
      - 'experiments/JSM/five-case/raw/**'
      - 'experiments/common/five-case/claude-analysis-prompt.md'
      - '.github/workflows/jsm-analyze.yml'
      - 'experiments/common/five-case/digest.cjs'
      - 'experiments/common/five-case/team-gather.cjs'
permissions:
  contents: write
  actions: read
concurrency:
  group: jsm-analyze
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          sparse-checkout: |
            experiments/case3
            experiments/case4
            experiments/case5
            experiments/common/five-case
            simulator
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Archive experiment artifacts not yet in the repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCH=experiments/common/five-case/raw/github
          mkdir -p "$ARCH"
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            -q '.artifacts[] | select(.expired|not) | select(.workflow_run.head_branch=="jsm")
                | select(.name=="batch-summary" or (.name|startswith("jsm-five-case-"))) | .workflow_run.id' \
            | sort -u > runs.txt
          while read -r RUN; do
            [ -d "$ARCH/$RUN" ] && continue
            gh run download "$RUN" -R "${{ github.repository }}" -D "$ARCH/$RUN" -p 'jsm-five-case-*' -p batch-summary \
              && echo "$RUN" >> new-runs.txt || rm -rf "$ARCH/$RUN"
          done < runs.txt
          echo "새로 보관한 실행: $(cat new-runs.txt 2>/dev/null | tr '\n' ' ')"
      - name: Gather and re-score every team answer (no AI)
        id: team
        run: |
          node experiments/common/five-case/team-gather.cjs --cases 3,4,5 --top 10 --max500 40 | tee gather.txt
          echo "new=$(sed -n 's/.*scored public \([0-9]*\).*/\1/p' gather.txt)" >> "$GITHUB_OUTPUT"
      - name: Compute digest and basic report (no AI)
        id: digest
        run: |
          node experiments/common/five-case/digest.cjs --out digest.json --md basic.md
          echo "new=$(node -e 'console.log(require("./digest.json").sources.new.length)')" >> "$GITHUB_OUTPUT"
      - name: Decide whether anything is new
        id: gate
        run: |
          N=$(( ${{ steps.team.outputs.new || 0 }} + ${{ steps.digest.outputs.new || 0 }} ))
          if [ "$N" -gt 0 ] || [ "${{ github.event_name }}" = "push" -a -n "$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E 'claude-analysis-prompt|jsm-analyze' )" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "run=0" >> "$GITHUB_OUTPUT"; fi
          echo "새 결과 파일 ${{ steps.digest.outputs.new }}개, 새 팀 답안 ${{ steps.team.outputs.new }}개"
      - name: Install Claude Code
        if: steps.gate.outputs.run == '1'
        run: npm install -g @anthropic-ai/claude-code
      - name: Deep analysis (AI)
        if: steps.gate.outputs.run == '1'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat experiments/common/five-case/claude-analysis-prompt.md)" \
            --allowedTools "Read,Glob,Grep,Write" \
            --max-turns 40 > claude-log.txt
          test -s deep.md
      - name: Combine report (code basic + AI deep)
        if: steps.gate.outputs.run == '1'
        run: |
          cp basic.md report.md
          if [ -s deep.md ]; then printf '\n---\n\n' >> report.md; cat deep.md >> report.md
          else printf '\n---\n\n> 심화 분석(AI) 실패: claude-log.txt 확인\n' >> report.md; fi
      - name: Publish report
        if: always()
        run: |
          [ -s report.md ] && cat report.md >> "$GITHUB_STEP_SUMMARY" || echo "report.md 없음" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report to jsm
        if: always() && github.ref == 'refs/heads/jsm' && steps.gate.outputs.run == '1'
        run: |
          [ -s report.md ] || { echo "no report"; exit 0; }
          DIR=experiments/common/five-case/reports
          NAME="$(TZ=Asia/Seoul date +%m%d-%H%M)-run${{ github.run_id }}"
          mkdir -p "$DIR"; cp report.md "$DIR/$NAME.md"; cp digest.json "$DIR/digest-latest.json"
          node experiments/common/five-case/digest.cjs --save-state --out /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch --depth=1 origin jsm && git reset -q --mixed FETCH_HEAD
            for f in "$DIR/$NAME.md" "$DIR/known-insights.md" "$DIR/digest-latest.json" "$DIR/digest-state.json" experiments/common/five-case/raw/github experiments/common/five-case/team/scores.json; do
              if [ -e "$f" ]; then git add -f "$f"; fi
            done
            git commit -q -m "Claude analysis $NAME [skip ci]" && git push origin HEAD:jsm && exit 0
            sleep $((i*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            report.md
            deep.md
            digest.json
            claude-log.txt
          if-no-files-found: warn
          retention-days: 30
