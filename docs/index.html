<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IE325 배차 트리 평가</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#edf1f5;color:#17253a;font:16px/1.6 system-ui,sans-serif}
    main{max-width:990px;margin:auto;padding:30px 16px}
    h1,h2{line-height:1.22;overflow-wrap:anywhere} h1{margin:0}
    a{color:#1741a5}
    button{background:#2054c9;color:white;border:0;border-radius:6px;padding:8px 13px;font:inherit;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    form{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    input{max-width:100%;font:inherit}
    #status{min-height:1.6em}
    #results:empty{display:none}
    #results{background:white;border:1px solid #cfd8e4;border-radius:10px;padding:16px}
    .graph{overflow:auto;border:1px solid #cfd8e4;border-radius:6px}
    canvas{display:block;margin:auto}
    details{padding:8px 0} summary{cursor:pointer}
    table{width:100%;border-collapse:collapse} th,td{text-align:left;padding:7px;border-bottom:1px solid #dbe2ec}
    .average{font-weight:700}
  </style>
  <script type="module" src="./viewer.js"></script>
</head>
<body><main>
  <h1>배차 트리 평가</h1>
  <p>설계 CSV를 불러와 배차 트리와 시드별 비용을 확인하세요. 파일은 브라우저에서만 읽습니다.</p>
  <form>
    <label for="file">설계 CSV</label>
    <input id="file" type="file" accept=".csv,text/csv" required>
    <button type="submit">트리와 점수 보기</button>
  </form>
  <p>로컬 점수는 공식 점수와 다를 수 있습니다. <a href="https://script.google.com/macros/s/AKfycbyfytW6GhEMwkUIE7xja48WGlirBBES_VTXoXxVuzDSHAfcML17mWYwT7VDdBA8gFD9/exec?p=case" target="_blank" rel="noopener">공식 실습기에서 같은 CSV 평가하기</a></p>
  <p id="status" role="status"></p>
  <section id="results" aria-label="배차 트리와 점수"></section>
</main></body></html>
